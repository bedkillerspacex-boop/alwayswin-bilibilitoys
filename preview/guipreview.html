<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fatality ClickGui preview</title>
<link rel="stylesheet" href="../extension/overlay.css">
<style>
  @font-face{font-family:"Product Sans";src:url("../assets/fonts/Product-Sans-Bold.ttf") format("truetype");font-weight:700;font-display:block}
  @font-face{font-family:"Product Sans";src:url("../assets/fonts/Product-Sans.ttf") format("truetype");font-weight:400;font-display:block}
  html,body{margin:0;padding:0;background:#05060a;overflow:hidden}
  #bg{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;opacity:0.5;z-index:0}
  #err{position:fixed;left:8px;top:6px;z-index:2147483647;color:#ff6b81;font:12px monospace;white-space:pre-wrap;max-width:1500px}
</style>
</head>
<body>
<img id="bg" src="bg.png">
<pre id="err"></pre>
<script src="../extension/boot.js"></script>
<script src="../js/core.js"></script>
<script src="../modules/Visual/Interface.js"></script>
<script src="../modules/Visual/Arraylist.js"></script>
<script src="../modules/Visual/Watermark.js"></script>
<script src="../modules/Visual/Notifications.js"></script>
<script src="../modules/Visual/Fatality.js"></script>
<script src="../modules/Visual/ThirdPerson.js"></script>
<script src="../modules/Visual/ClickGuiFatality.js"></script>
<script src="../modules/Visual/ClickGui.js"></script>
<script src="../modules/Combat/Helper.js"></script>
<script src="../modules/Player/AntiAim.js"></script>
<script src="../modules/Movement/Speed.js"></script>
<script src="../modules/Movement/NoSlowdown.js"></script>
<script src="../modules/Movement/NoClip.js"></script>
<script src="../modules/Movement/HighJump.js"></script>
<script src="../modules/Movement/SimulationDisabler.js"></script>
<script src="../modules/Misc/InputGuard.js"></script>
<script src="../modules/Misc/Config.js"></script>
<script src="../js/main.js"></script>
<script src="../js/commands.js"></script>
<script src="../extension/page.js"></script>
<script>
(async () => {
  const err = document.getElementById('err');
  const log = (m) => { err.textContent += m + '\n'; };
  window.addEventListener('error', (e) => log('ERR ' + e.message));

  try { await document.fonts.load('700 100px "Product Sans"'); } catch (e) {}
  await document.fonts.ready;
  await new Promise((r) => setTimeout(r, 120));

  const cg = getMod('ClickGui');
  const style = cg.settings.find((s) => s.n === 'Style');
  const cat = new URLSearchParams(location.search).get('cat');
  const styleParam = new URLSearchParams(location.search).get('style');

  if (styleParam === 'sol') style.v = 0;
  else style.v = 1;

  if (cat) {
    const ft = FT_STATE;
    ft.cat = Math.max(0, ['Combat', 'Movement', 'Player', 'Visual', 'Misc'].indexOf(cat));
  }

  const fat = getMod('Fatality');
  if (fat) { const pi = fat.settings.find((s) => s.n === 'Play on inject'); if (pi) pi.v = 0; setModuleOn(fat, false); }
  S.open = true;
  S.ease.p = 1;

  const n = Number(new URLSearchParams(location.search).get('frames') || 6);
  let ts = 1000;
  let worst = 0;
  let total = 0;
  for (let i = 0; i < n; i += 1) {
    ts += 16;
    const t0 = performance.now();
    frame(ts);
    const dt = performance.now() - t0;
    worst = Math.max(worst, dt);
    total += dt;
  }

  /* ── 交互回归：侧栏点击 + 滑条拖动 ── */
  if (new URLSearchParams(location.search).get('test')) {
    const report = [];
    const ok = (cond, label, extra) => report.push(`${cond ? 'PASS' : 'FAIL'}  ${label}${extra ? '  ' + extra : ''}`);

    const dbg = FT_STATE.dbg || { ox: 0, oy: 0, s: 1, sliders: [] };
    const toScreen = (x, y) => ({ mx: dbg.ox + x * dbg.s, my: dbg.oy + y * dbg.s });
    const click = (x, y, hold) => {
      const p = toScreen(x, y);
      S.mx = p.mx;
      S.my = p.my;
      S.clicked = [true, false, false];
      S.down = [Boolean(hold), false, false];
      ts += 16;
      frame(ts);
    };
    const release = () => {
      S.down = [false, false, false];
      S.clicked = [false, false, false];
      ts += 16;
      frame(ts);
    };

    /* 侧栏：Combat → Movement */
    FT_STATE.cat = 0;
    click(44, 40 + 8 + 26 + 12);
    release();
    ok(FT_STATE.cat === 1, 'sidebar tab click switches category', 'cat=' + FT_STATE.cat);

    /* 侧栏：切到 Visual 再回来，确认能连续点 */
    click(44, 40 + 8 + 3 * 26 + 12);
    release();
    ok(FT_STATE.cat === 3, 'sidebar keeps responding', 'cat=' + FT_STATE.cat);
    click(44, 40 + 8 + 12);
    release();
    ok(FT_STATE.cat === 0, 'sidebar back to Combat', 'cat=' + FT_STATE.cat);

    /* 切到 Movement 找滑条（Combat 本页只有勾选框） */
    click(44, 40 + 8 + 26 + 12);
    release();
    ts += 16;
    frame(ts);

    /* 滑条：按在轨道 75% 处 */
    const slider = (FT_STATE.dbg.sliders || [])[0];
    ok(Boolean(slider), 'found a number slider to test');

    if (slider) {
      const st = slider.setting;
      const before = st.v;
      const targetX = slider.x + slider.w * 0.75;
      click(targetX, slider.y + 6, true);
      const afterPress = st.v;
      ok(afterPress > before, 'pressing the track moves the slider', `${before} -> ${afterPress}`);

      const expect = clamp(st.min + (st.max - st.min) * 0.75, st.min, st.max);
      ok(Math.abs(afterPress - expect) <= st.step * 1.5, 'slider lands near the click point', `v=${afterPress} expect≈${expect.toFixed(2)}`);

      /* 拖到左边 20% */
      const p2 = toScreen(slider.x + slider.w * 0.2, slider.y + 6);
      S.mx = p2.mx; S.my = p2.my; S.clicked = [false, false, false]; S.down = [true, false, false];
      ts += 16; frame(ts);
      ok(st.v < afterPress, 'dragging keeps following the cursor', `v=${st.v}`);
      release();

      /* 松手后再按标签区（不在轨道上）不应改动数值 */
      const keep = st.v;
      const labelPoint = toScreen(slider.x - 60, slider.y + 6);
      S.mx = labelPoint.mx; S.my = labelPoint.my; S.clicked = [true, false, false]; S.down = [true, false, false];
      ts += 16; frame(ts);
      ok(st.v === keep, 'pressing the row label does not touch the value', `v=${st.v}`);
      release();
    }

    document.title = report.some((l) => l.startsWith('FAIL')) ? 'FAIL' : 'ALL-PASS';
    log(report.join('\n'));
    return;
  }

  log(`style=${style.vals[style.v]} cat=${CATS[FT_STATE.cat]} frames=${n}`);
  document.title = 'GUI-READY';
})();
</script>
</body>
</html>
